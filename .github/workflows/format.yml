name: Format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting (server)
        working-directory: picolemon_server
        run: dart format --set-exit-if-changed .

      - name: Check formatting (games)
        working-directory: picolemon_games
        run: dart format --set-exit-if-changed .
