name: Analyze

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze server
        working-directory: picolemon_server
        run: dart analyze --fatal-infos

      - name: Analyze games
        working-directory: picolemon_games
        run: dart analyze --fatal-infos
